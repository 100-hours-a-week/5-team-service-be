name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─── main PR 보호: develop 또는 hotfix/* 브랜치만 허용 ────────────
  check-source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ] && [[ "${{ github.head_ref }}" != hotfix/* ]]; then
            echo "❌ Error: Only 'develop' or 'hotfix/*' branches can be merged into 'main'"
            echo "Source branch: ${{ github.head_ref }}"
            exit 1
          fi
          echo "✅ Source branch validation passed: ${{ github.head_ref }}"

  # ─── CI: PR에서만 실행 — 컴파일 + checkstyle 검사 ─────────────────
  # TODO: 테스트 추가 시 -x test 제거하여 PR에서 테스트 실행
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # compile + checkstyle (test는 아직 없으므로 제외)
      - name: Build (includes compile check)
        run: ./gradlew build -x test --no-daemon --build-cache --parallel

      - name: Notify Discord on failure
        if: failure()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"❌ **Backend CI 빌드 실패**\",
                 \"embeds\": [{
                   \"title\": \"🔴 빌드 실패 알림\",
                   \"color\": 15158528,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
                     {\"name\": \"💬 커밋 메시지\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                     {\"name\": \"👤 작성자\", \"value\": \"$COMMIT_AUTHOR\", \"inline\": true},
                     {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인]($ACTIONS_URL)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }} || true

  # ─── Build & Push: push/dispatch에서만 실행 — JAR 빌드 + Docker 이미지 ECR push ──
  # ci job을 거치지 않음 (PR에서 이미 검증된 코드만 push됨)
  build-and-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      api-changed: ${{ steps.changes.outputs.api }}
      chat-changed: ${{ steps.changes.outputs.chat }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git diff 변경감지에 전체 히스토리 필요

      # git diff로 변경된 모듈만 감지 → 안 바뀐 모듈은 이미지 생성 스킵
      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
            echo "Changed files:"
            echo "$CHANGED"

            API=false; CHAT=false
            while IFS= read -r file; do
              case "$file" in
                api/*) API=true ;;
                chat/*) CHAT=true ;;
                # 공유 파일 변경 시 전체 빌드
                common/*|build.gradle*|settings.gradle*|gradle.properties|Dockerfile|docker-bake.hcl|.dockerignore)
                  API=true; CHAT=true ;;
              esac
            done <<< "$CHANGED"

            # 모듈 외 변경(docs, .github 등)은 안전하게 전체 빌드
            if [ "$API" == "false" ] && [ "$CHAT" == "false" ]; then
              API=true; CHAT=true
              echo "No module-specific changes, building all"
            fi
          else
            # workflow_dispatch 또는 브랜치 첫 push는 전체 빌드
            API=true; CHAT=true
            echo "workflow_dispatch or first push: building all"
          fi

          echo "api=$API" >> $GITHUB_OUTPUT
          echo "chat=$CHAT" >> $GITHUB_OUTPUT
          echo "API: $API, Chat: $CHAT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"  # Gradle 의존성 캐시 (GHA Cache API 경유)

      # bootJar만 실행 — checkstyle은 PR ci job에서 이미 통과
      # TODO: 테스트 추가 시 bootJar 전에 ./gradlew test 스텝 추가
      - name: Build JARs
        run: chmod +x ./gradlew && ./gradlew :api:bootJar :chat:bootJar -x test -x checkstyleMain -x checkstyleTest --no-daemon --build-cache --parallel

      - name: Notify Discord on CI failure
        if: failure()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"❌ **Backend CI 빌드 실패**\",
                 \"embeds\": [{
                   \"title\": \"🔴 빌드 실패 알림\",
                   \"color\": 15158528,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
                     {\"name\": \"💬 커밋 메시지\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                     {\"name\": \"👤 작성자\", \"value\": \"$COMMIT_AUTHOR\", \"inline\": true},
                     {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인]($ACTIONS_URL)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }} || true

      # ── ECR 인증 + 이미지 빌드/푸시 ──
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # develop → :develop 태그, main → :xxxxxxx (short SHA, ArgoCD 매니페스트와 일치)
      - name: Set image metadata
        id: meta
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "image-tag=develop" >> $GITHUB_OUTPUT
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "image-tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Bake: 변경된 모듈만 병렬 빌드+푸시 (Docker 캐시 미사용 — 오버헤드 > 이점)
      - name: Build and push images
        run: |
          TARGETS=""
          [ "${{ steps.changes.outputs.api }}" == "true" ] && TARGETS="$TARGETS api"
          [ "${{ steps.changes.outputs.chat }}" == "true" ] && TARGETS="$TARGETS chat"
          echo "Bake targets: $TARGETS"
          docker buildx bake -f docker-bake.hcl --push $TARGETS
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ steps.meta.outputs.image-tag }}

  # ─── Deploy: Dev (develop push) ──────────────────────────────────
  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy to Dev via SSM
        run: |
          COMMANDS=$(jq -n --arg registry "${{ secrets.ECR_REGISTRY }}" '[
            "set -e",
            ("export ECR_REGISTRY=" + $registry),
            "mkdir -p /home/ubuntu/app/secrets",
            "aws ssm get-parameter --name /doktori/dev/FIREBASE_SERVICE_ACCOUNT --with-decryption --query Parameter.Value --output text > /home/ubuntu/app/secrets/firebase-service-account.json",
            "docker compose -f /home/ubuntu/app/docker-compose.yml pull backend chat",
            "docker compose -f /home/ubuntu/app/docker-compose.yml up -d --no-deps backend chat",
            "sleep 10 && docker compose -f /home/ubuntu/app/docker-compose.yml exec -T nginx nginx -s reload",
            "docker image prune -f"
          ]')

          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Environment,Values=dev" "Key=tag:Service,Values=app" \
            --parameters "{\"commands\": $COMMANDS}" \
            --timeout-seconds 300 \
            --comment "deploy dev ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command: $CMD_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query "CommandInvocations[0].CommandPlugins[0].Output" --output text || true
                exit 1 ;;
              None)
                if [ "$i" -ge 3 ]; then
                  echo "::error::No instance matched SSM target (status=None)"
                  exit 1
                fi ;;
            esac
          done
          echo "::error::SSM command timed out"
          exit 1

      - name: Notify Discord
        if: always()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ job.status }}" == "success" ]; then
            COLOR=3066993; STATUS_EMOJI="✅"; STATUS_TEXT="배포 성공"
          else
            COLOR=15158528; STATUS_EMOJI="❌"; STATUS_TEXT="배포 실패"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"$STATUS_EMOJI **Backend Development 배포 알림**\",
                 \"embeds\": [{
                   \"title\": \"🔧 [Development] $STATUS_TEXT\",
                   \"color\": $COLOR,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
                     {\"name\": \"💬 커밋 메시지\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                     {\"name\": \"👤 작성자\", \"value\": \"$COMMIT_AUTHOR\", \"inline\": true},
                     {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인]($ACTIONS_URL)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }} || true

  # ─── Prod 배포: ArgoCD GitOps ─────────────────────────────────────
  # ECR push 완료 후 Cloud repo의 K8s 매니페스트 이미지 태그를 업데이트
  # ArgoCD가 main 브랜치를 polling(3분) → auto-sync → K8s 배포
  deploy-prod:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Update K8s manifests in Cloud repo
        run: |
          TAG="${{ needs.build-and-push.outputs.image-tag }}"
          REGISTRY="${{ secrets.ECR_REGISTRY }}"
          API_CHANGED="${{ needs.build-and-push.outputs.api-changed }}"
          CHAT_CHANGED="${{ needs.build-and-push.outputs.chat-changed }}"

          # Cloud repo 클론
          git clone --depth 1 https://x-access-token:${{ secrets.CLOUD_REPO_PAT }}@github.com/100-hours-a-week/5-team-service-cloud.git cloud
          cd cloud

          # 변경된 모듈만 이미지 태그 업데이트
          if [ "$API_CHANGED" == "true" ]; then
            sed -i "s|${REGISTRY}/doktori/prod-backend-api:[^ ]*|${REGISTRY}/doktori/prod-backend-api:${TAG}|" \
              k8s/manifests/workloads/api-deployment.yaml
            echo "Updated api image tag → ${TAG}"
          fi

          if [ "$CHAT_CHANGED" == "true" ]; then
            sed -i "s|${REGISTRY}/doktori/prod-backend-chat:[^ ]*|${REGISTRY}/doktori/prod-backend-chat:${TAG}|" \
              k8s/manifests/workloads/chat-deployment.yaml
            echo "Updated chat image tag → ${TAG}"
          fi

          # 변경 있으면 commit + push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "deploy(prod): api=${API_CHANGED} chat=${CHAT_CHANGED} tag=${TAG}

          Backend commit: ${{ github.sha }}
          Triggered by: ${{ github.event.head_commit.author.name }}"
            git push origin main
            echo "Pushed manifest update → ArgoCD will auto-sync"
          fi

      - name: Notify Discord
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="${{ needs.build-and-push.outputs.image-tag }}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ job.status }}" == "success" ]; then
            COLOR=3066993; STATUS_EMOJI="✅"; STATUS_TEXT="매니페스트 업데이트 완료 (ArgoCD auto-sync 대기)"
          else
            COLOR=15158528; STATUS_EMOJI="❌"; STATUS_TEXT="매니페스트 업데이트 실패"
          fi

          curl -sS -H "Content-Type: application/json" -X POST -d "{
            \"content\": \"${STATUS_EMOJI} **Backend Production 배포 알림**\",
            \"embeds\": [{
              \"title\": \"🚀 [Production] ${STATUS_TEXT}\",
              \"color\": ${COLOR},
              \"fields\": [
                {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                {\"name\": \"🌿 브랜치\", \"value\": \"\`main\`\", \"inline\": true},
                {\"name\": \"🔖 커밋\", \"value\": \"[\`${SHORT_SHA}\`](${COMMIT_URL})\", \"inline\": true},
                {\"name\": \"💬 커밋 메시지\", \"value\": \"${COMMIT_MSG}\", \"inline\": false},
                {\"name\": \"🏷 이미지 태그\", \"value\": \"\`${TAG}\`\", \"inline\": true},
                {\"name\": \"👤 작성자\", \"value\": \"${COMMIT_AUTHOR}\", \"inline\": true},
                {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인](${ACTIONS_URL})\", \"inline\": true}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }} || true
