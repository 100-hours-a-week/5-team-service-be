spring:
  config:
    import: 'aws-parameterstore:/doktori/prod/'
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
        shutdown-timeout: 200ms
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  structured:
    format:
      console: logstash

app:
  cookie:
    secure: true
    same-site: Lax
    domain: doktori.kr

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false