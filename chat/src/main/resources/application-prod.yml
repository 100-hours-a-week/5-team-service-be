spring:
  config:
    # 프로파일 문서가 application.yml 의 import 를 덮어쓸 수 있으므로 공통 설정도 여기 명시한다.
    import:
      - 'classpath:resilience4j-defaults.yml'
      - 'aws-parameterstore:/doktori/prod/'
  data:
    redis:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
        shutdown-timeout: 200ms
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  structured:
    format:
      console: logstash

app:
  cookie:
    secure: true
    same-site: Lax
    domain: doktori.kr

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ai:
  base-url: ${AI_BASE_URL:http://ai.prod.doktori.internal:8000/ai}
  api-key: ${AI_API_KEY}

---
spring:
  config:
    activate:
      on-profile: redis-sentinel
  data:
    redis:
      sentinel:
        master: ${SPRING_REDIS_SENTINEL_MASTER}
        nodes: ${SPRING_REDIS_SENTINEL_NODES}
