// common 모듈은 라이브러리로 사용되므로 bootJar 비활성화
plugins {
    id 'java-library'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Resilience4j (서킷 브레이커 / 재시도)
    // api 스코프: 클라이언트 구현체가 common 에 있어 api·chat 모듈에도 전파되어야 한다.
    api 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    api 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.github.resilience4j:resilience4j-micrometer:2.2.0'

    api 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // TSID
    implementation 'com.github.f4b6a3:tsid-creator:5.2.6'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ShedLock
    api 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
    api 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.16.0'

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Test
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
}
