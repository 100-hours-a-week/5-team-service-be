spring:
  config:
    import: 'aws-parameterstore:/doktori/prod/'
  data:
    redis:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
        shutdown-timeout: 200ms
  rabbitmq:
    connection-timeout: 5000ms
    requested-heartbeat: 30s
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.example.doktoribackend: INFO
  structured:
    format:
      console: logstash

app:
  cookie:
    secure: true
    same-site: Lax
    domain: doktori.kr

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ai:
  base-url: ${AI_BASE_URL:https://ai.doktori.kr}
  api-key: ${AI_API_KEY}