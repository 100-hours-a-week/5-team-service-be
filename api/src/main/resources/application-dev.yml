spring:
  config:
    import: 'aws-parameterstore:/doktori/dev/'
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
logging:
  level:
    org.hibernate.SQL: debug
  structured:
    format:
      console: logstash
app:
  cookie:
    secure: true
    same-site: None
    domain:
  jwt:
    access-exp-minutes: 43200  # 30일 (부하테스트용)

