spring:
  config:
    # 프로파일 문서가 application.yml 의 import 를 덮어쓸 수 있으므로 공통 설정도 여기 명시한다.
    import:
      - 'classpath:resilience4j-defaults.yml'
      - 'aws-parameterstore:/doktori/dev/'
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
logging:
  level:
    org.hibernate.SQL: debug
  structured:
    format:
      console: logstash
app:
  cookie:
    secure: true
    same-site: None
  jwt:
    access-exp-minutes: 43200  # 30일 (부하테스트용)

